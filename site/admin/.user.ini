; Raises this account's effective post_max_size for the admin front
; controller. Required per docs/php-admin-architecture.md section 7.2: the
; contract's own /upload cap is 8 MiB (FC365_MAX_UPLOAD_BODY in config.php),
; but Apache/PHP-FPM enforce their OWN post_max_size ini limit on the total
; request body BEFORE any PHP code in this application ever runs, regardless
; of Content-Type. If the host's default post_max_size is smaller than our
; cap (an 8M shared-hosting default is common), an upload that is well
; within our own limit would never reach the clean, pre-read 413 JSON
; handler in site/admin/api.php at all -- it would hit the host's own
; generic error page instead, breaking the frozen contract's promised error
; shape for no reason a developer would expect from reading this codebase.
;
; This file is never reachable by any URL: it is a dotfile, and both
; site/.htaccess's `RewriteRule "(^|/)\." - [F]` and normal Apache/PHP
; convention already refuse to serve .user.ini directly.
;
; PHP re-reads .user.ini files periodically (user_ini.cache_ttl, default
; 300 seconds) without a server restart, but not instantly -- allow a few
; minutes after a fresh deploy before relying on this having taken effect.
;
; NOT verified against the real production host from this codebase's own
; development machine (no php-fpm/Apache available to test against) -- see
; the honesty note in docs/php-admin.md section 5. Confirm this actually
; changed the effective post_max_size (e.g. via a temporary phpinfo() check
; or by attempting a >8 MiB upload and confirming a clean 413, not a host
; error page) as part of the production migration, per
; docs/php-admin-architecture.md section 7.2's own action item.
post_max_size = 10M
